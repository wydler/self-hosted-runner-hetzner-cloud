---
name: "Create Hetzner Cloud runner"

on:      
   workflow_dispatch:
     inputs:
       location:
        type: choice
        description: Location
        required: false
        options: 
          - hel1  # Helsinki, Finnland
          - fsn1  # Falkenstein, Germany
          - nbg1  # Nuremberg, Germany
        default: "fsn1"     
       os:
        type: choice
        description: Operating System
        required: false
        options: 
          - ubuntu-22.04
          - ubuntu-24.04
          - ubuntu-26.04          
        default: "ubuntu-24.04"
       servertype:
        type: choice 
        description: Server Type
        required: true
        options:
          - cax21
          - cax31
          - cpx32        
          - ccx23
        default: "cpx32"
       runner_count:
         type: string
         description: Number of runners
         required: true
         default: "2"
       runner_scope:
         type: choice 
         description: Select scope for this runner
         required: false
         options:
           - repo
           - org
         default: 'org'
       runner_group:
         type: choice 
         description: Select scope for this runner
         required: false
         options:
           - Default
           - Daniel-Hetzner
           - Test
         default: 'Default'
       runner_start_method:
         type: choice 
         description: Select scope for this runner
         required: false
         options:
           - standalone
           - systemd
           - systemd-stopped
         default: 'systemd'         
       hcloud_ssh_key:
         type: string
         description: Name des SSH Keys
         required: true
         default: ""    
       runner_labels:
         type: string
         description: Labels für den Runner
         required: false
         default: "" 

jobs:
  get-hcloud-snapshot:
    name: Get Hetzner Cloud Snapshot ID
    runs-on: ubuntu-slim

    steps:
      # Installiert die offizielle Hetzner Cloud CLI
      - name: Install Hetzner Cloud Cli
        uses: hetznercloud/setup-hcloud@ac9e7d74fb41a3ca44a6a3da123bd5aa70731e3a  # v2.0.0

      # Sucht nach dem neuesten Snapshot anhand des OS-Labels
      - name: Looking for a snapshot ID
        id: find_snapshot
        run: |
          # Ausgewaehlten Servertyp aus dem GitHub-Action-Input übernehmen
          servertype="${{ inputs.servertype }}"

          # CAX-Server verwenden ARM64-Prozessoren.
          # Für die hcloud CLI wird die Architektur als "arm" angegeben.
          # Alle anderen Servertypen verwenden x86.
          if [[ "${servertype:0:3}" == "cax" ]]; then
            arch="arm"
          else
            arch="x86"
          fi

          # Alle verfügbaren Snapshots mit passendem OS-Label anzeigen
          echo -e "$(hcloud image list --type "snapshot" -l "os=${{ inputs.os }}" -a "$arch" -s "id:desc")\n"

          # Neueste Snapshot-ID ermitteln
          object=$(hcloud image list --output "columns=ID" --output "noheader" --type "snapshot" -l "os=${{ inputs.os }}" -a "$arch" -s "id:desc" | head -n 1 )
          
          if [ -n "$object" ]; then
            
            # Gefundene Snapshot-ID ausgeben
            echo ID: "$object"

            # Snapshot-ID für nachfolgende Steps exportieren
            echo "id=$object" >> "$GITHUB_OUTPUT"
            
          else
          
            # Fehler ausgeben, wenn kein Snapshot gefunden wurde
            echo "::error::Keine Snapshot für das angegebene OS gefunden."

            # Workflow mit Fehler beenden
            exit 1
          fi
        env:
           # Hetzner Cloud API Token aus GitHub Secrets
           HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN_GHSHR_RW }}

      - name: Write ReleaseName
        run: echo "${{ steps.find_snapshot.outputs.id }}"

    outputs:
      snapshot_id: ${{ steps.find_snapshot.outputs.id }}


  get-hcloud-sshkey:
    name: Get Hetzner Cloud SSH Key ID
    runs-on: ubuntu-slim

    steps:
      # Installiert die offizielle Hetzner Cloud CLI
      - name: Install Hetzner Cloud Cli
        uses: hetznercloud/setup-hcloud@ac9e7d74fb41a3ca44a6a3da123bd5aa70731e3a  # v2.0.0

      # Sucht nach dem SSH Key anhand des Namens
      - name: Looking for SSH key ID
        id: find_sshkey
        run: |         
          # Alle verfügbaren SSH Keys anzeigen
          echo -e "$(hcloud ssh-key list)\n"

          # ID des SSH Keys ermitteln
          object=$(hcloud ssh-key describe "${{ inputs.hcloud_ssh_key }}" | awk '/^ID:/ {print $2}')
          # 
          if [ -n "$object" ]; then
            
            # Gefundene SSH Key ID ausgeben
            echo ID: "$object"

            # SSH Key ID für nachfolgende Steps exportieren
            echo "id=$object" >> "$GITHUB_OUTPUT"
            
          else
          
            # Fehler ausgeben, wenn kein SSH Key gefunden wurde
            echo "::error::SSH Key '${{ inputs.hcloud_ssh_key }}' wurde nicht gefunden."

            # Workflow mit Fehler beenden
            exit 1
          fi
        env:
           # Hetzner Cloud API Token aus GitHub Secrets
           HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN_GHSHR_RW }}

      - name: Write SSH Key ID
        run: echo "${{ steps.find_sshkey.outputs.id }}"

    outputs:
      ssh_key_id: ${{ steps.find_sshkey.outputs.id }}


  prepare-runner-matrix:
    name: Prepare runner matrix
    runs-on: ubuntu-slim

    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    steps:
      - name: Generate matrix
        id: set-matrix
        run: |
          count="${{ inputs.runner_count }}"

          if ! [[ "$count" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::runner_count muss eine positive Ganzzahl sein."
            exit 1
          fi
         
          matrix=$(jq -cn --argjson count "$count" '
            [range(1; $count + 1)]
          ')
         
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"


  create-runner:
    name: Create runner
    runs-on: ubuntu-latest
    needs:
      - get-hcloud-snapshot
      - get-hcloud-sshkey      
      - prepare-runner-matrix
    
    outputs:
      label: ${{ steps.create-hcloud-runner.outputs.label }}
      server_id: ${{ steps.create-hcloud-runner.outputs.server_id }}

    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJson(needs.prepare-runner-matrix.outputs.matrix) }}
        
    steps:
      - name: Generate GitHub token
        id: generate_token
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859  # v3.0.0
        with:
          app-id: ${{ secrets.GH_APP_SHRHC_ID }}
          private-key: ${{ secrets.GH_APP_SHRHC_PRIVATE_KEY }}
          
      - name: Create runner instance
        id: create-hcloud-runner
        # uses: wydler/hcloud-self-hosted-github-runner@c2a407295a3f3ccf0ca7473d0489849a8fd71354  # 1.0.0
        # uses: wydler/hcloud-self-hosted-github-runner@9b01f89f78542a52537c8ca69961a7b4d31d6335
        uses: wydler/hcloud-self-hosted-github-runner@cc1fdca4c2b3c9aca2902b65e1056ff3d91240b2
        with:
          mode: create
          github_token: ${{ steps.generate_token.outputs.token }}
          hcloud_token: ${{ secrets.HCLOUD_TOKEN_GHSHR_RW }}
          server_type: ${{ inputs.servertype }}
          location: ${{ inputs.location }}  
          image: ${{ needs.get-hcloud-snapshot.outputs.snapshot_id }}
          server_wait: "120"
          runner_scope: ${{ inputs.runner_scope }}
          create_wait: "1" # 1*10 Sekunden = 10 Sekunden
          ssh_key: ${{ needs.get-hcloud-sshkey.outputs.ssh_key_id }}
          runner_start_method: ${{ inputs.runner_start_method }}
          runner_group: ${{ inputs.runner_group }}
          runner_labels: ${{ inputs.runner_labels }} 
